[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "babysteps"
version = "0.1.0"
description = "A reproducible single-GPU speedrun for humanoid locomotion RL with a frozen robustness bar."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
dependencies = [
  "mjlab==1.6.0",
  "rsl-rl-lib==5.4.2",
  "mujoco~=3.11.0",
  "mujoco-warp~=3.11.0",
  "warp-lang==1.14.0",
  "torch==2.9.0",
  "tensordict==0.10.0",
  "numpy",
  "tyro>=1.0.1",
  "nvtx>=0.2.10",
  "nvidia-ml-py>=12.0",
  "tensorboard>=2.20.0",
  "mediapy>=1.2.7",
  "imageio-ffmpeg",
]

[project.optional-dependencies]
cu128 = ["torch==2.9.0"]
cpu = ["torch==2.9.0"]

[project.scripts]
bs-train = "babysteps.train.launch:main"
bs-eval = "babysteps.eval.time_to_bar:main"
bs-ledger = "babysteps.ledger:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
conflicts = [[{ extra = "cu128" }, { extra = "cpu" }]]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
torch = [
  { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
]

[tool.ruff]
src = ["src"]
indent-width = 2
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
markers = ["gpu: needs a CUDA device (skipped in CI)"]
