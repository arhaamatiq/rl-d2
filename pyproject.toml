[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "rl-d2"
version = "0.1.0"
description = "A reproducible single-GPU speedrun for humanoid locomotion RL with a frozen robustness bar."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
  "mjlab==1.6.0",
  "rsl-rl-lib==5.4.2",
  "mujoco~=3.11.0",
  "mujoco-warp~=3.11.0",
  "warp-lang==1.14.0",
  "torch==2.9.0",
  "tensordict==0.10.0",
  "numpy",
  "tyro>=1.0.1",
  "nvtx>=0.2.10",
  "nvidia-ml-py>=12.0",
  "tensorboard>=2.20.0",
  "mediapy>=1.2.7",
  "imageio-ffmpeg",
]

[project.optional-dependencies]
cu128 = ["torch==2.9.0"]
cpu = ["torch==2.9.0"]

[project.scripts]
rld2-train = "rl_d2.train.launch:main"
rld2-eval = "rl_d2.eval.time_to_bar:main"
rld2-ledger = "rl_d2.ledger:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
